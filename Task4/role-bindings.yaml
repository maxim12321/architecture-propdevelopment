apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  namespace: secure-space
  name: read-secrets
subjects:
- kind: ServiceAccount
  namespace: secure-space
  name: secure-operator
roleRef:
  kind: Role
  name: secret-reader
  apiGroup: rbac.authorization.k8s.io

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  namespace: default
  name: write-pods
subjects:
- kind: ServiceAccount
  namespace: default
  name: devops
roleRef:
  kind: Role
  name: pod-writer
  apiGroup: rbac.authorization.k8s.io

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  namespace: default
  name: read-pods
subjects:
- kind: ServiceAccount
  namespace: default
  name: developer
roleRef:
  kind: Role
  name: pod-reader
  apiGroup: rbac.authorization.k8s.io

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  namespace: default
  name: read-logs
subjects:
- kind: ServiceAccount
  namespace: default
  name: developer
- kind: ServiceAccount
  namespace: default
  name: devops
roleRef:
  kind: Role
  name: logs-reader
  apiGroup: rbac.authorization.k8s.io
